name: Build

# Builds the native wheels, the sdist and the pure wheel; it never publishes. On its own it runs only when
# the build inputs change, and release.yml calls it before publishing.
on:
  push:
    branches: [main]
    paths:
      - "src/unaiverse/networking/p2p/unailib/**"
      - "src/unaiverse/networking/p2p/_unailib_source.py"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/build.yml"
      - ".github/scripts/smoke_wheel.py"
  pull_request:
    paths:
      - "src/unaiverse/networking/p2p/unailib/**"
      - "src/unaiverse/networking/p2p/_unailib_source.py"
      - "setup.py"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/build.yml"
      - ".github/scripts/smoke_wheel.py"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64, macos-15-intel is x86_64 (the macos-14 image is retired)
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v5

      # On macOS and Windows cibuildwheel builds on the runner, so Go comes from here; on Linux it builds
      # inside the manylinux container, where before-all (pyproject.toml) installs it
      - uses: actions/setup-go@v7
        if: runner.os != 'Linux'
        with:
          go-version-file: src/unaiverse/networking/p2p/unailib/go.mod
          cache-dependency-path: src/unaiverse/networking/p2p/unailib/go.sum

      - uses: pypa/cibuildwheel@v3.2.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Smoke test the wheel
        shell: bash
        run: python .github/scripts/smoke_wheel.py wheelhouse/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          pip install build
          python -m build --sdist

      - name: Check the sdist content
        run: |
          tar -tzf dist/*.tar.gz > sdist-files.txt
          grep -q '/p2p/unailib/api.go$' sdist-files.txt
          grep -q '/p2p/unailib/go.sum$' sdist-files.txt
          if grep -E '\.(so|dylib|dll|pyd|h|sha256)$' sdist-files.txt; then
            echo "::error::the sdist carries built binaries"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  pure:
    name: Pure wheel (Pyodide)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build pure wheel
        env:
          UNAI_BUILD_PURE: "1"
        run: |
          pip install build
          python -m build --wheel
          ls dist/*-py3-none-any.whl

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-pure
          path: dist/*.whl
