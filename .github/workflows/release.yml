# .github/workflows/release.yml
name: Build and Publish Wheels to PyPI

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v0.1.0, v1.2.3, etc.

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for ARM builds on Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Install build dependencies
        run: python -m pip install cibuildwheel==2.19.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # --- This is the key for your Go build ---
          # Run this command inside the build environment before building the wheel.
          # It installs the Go compiler.
          CIBW_BEFORE_BUILD: >
            curl -OL https://go.dev/dl/go1.22.5.linux-amd64.tar.gz &&
            sudo rm -rf /usr/local/go &&
            sudo tar -C /usr/local -xzf go1.22.5.linux-amd64.tar.gz &&
            export PATH=$PATH:/usr/local/go/bin &&
            go version
          
          # Pass CGO_ENABLED=1 to the build command environment.
          CIBW_ENVIRONMENT: CGO_ENABLED="1"
          
          # --- Optional: Specify architectures ---
          # By default, cibuildwheel builds for all common architectures.
          # You can restrict it if you want.
          # CIBW_ARCHS_LINUX: x86_64 aarch64
          # CIBW_ARCHS_MACOS: x86_64 arm64
          # CIBW_ARCHS_WINDOWS: AMD64

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unaiverse
    permissions:
      id-token: write

    steps:
      - name: Download all packages from artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-packages-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
