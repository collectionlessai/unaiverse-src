# .github/workflows/release.yml
name: Build and Publish Wheels to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This action correctly installs Go for any OS/architecture
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x' # Use a flexible version

      - name: Set up QEMU (for ARM builds on Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.19.1

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          # CIBW_BEFORE_BUILD is no longer needed! Go is already installed.
          # We still need to pass CGO_ENABLED to the build environment.
          CIBW_ENVIRONMENT: CGO_ENABLED="1"

      - name: Store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  publish_to_pypi:
    name: Publish to PyPI
    needs: build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/unaiverse
    permissions:
      id-token: write

    steps:
      - name: Download all packages from artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: python-packages-*
          merge-multiple: true

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
