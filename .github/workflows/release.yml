name: Release

# Publishing starts only from a v* tag, which release.sh (unaiverse-dev) pushes after its own checks. A
# manual run is a dry run: tests and build, without publishing.
#
# Keep this file name and the publish job here: the PyPI trusted publisher is registered on this file and
# does not accept the publish step inside a reusable workflow.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tag matches the package version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version in pyproject.toml (${version})"
            exit 1
          fi
          # PEP 440 pre-releases (a, b, rc, dev) are marked as such on GitHub too
          if [[ "${version}" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    uses: ./.github/workflows/tests.yml

  build:
    uses: ./.github/workflows/build.yml

  publish_pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, tests, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      # Native wheels and sdist only: the pure wheel would be installed on platforms without a native one,
      # where the package cannot work
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      # The pure wheel for Pyodide is published here only
      - uses: actions/download-artifact@v8
        with:
          name: wheel-pure
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          files: dist/*
