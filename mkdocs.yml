site_name: UNaIVERSE Docs
site_description: "UNaIVERSE — The new web of humans & AI Agents."
site_url: https://collectionless.ai
repo_url: https://github.com/collectionlessai/unaiverse-src
repo_name: collectionlessai/unaiverse-src
copyright: "&copy; 2024–2026 Collectionless AI — UNaIVERSE Project"

theme:
  name: material
  
  font:
    text: Inter
    code: JetBrains Mono

  icon:
    logo: fontawesome/solid/brain 
    repo: fontawesome/brands/github
    admonition:
      note: fontawesome/solid/circle-info
      abstract: fontawesome/solid/book
      info: fontawesome/solid/circle-info
      tip: fontawesome/solid/lightbulb
      success: fontawesome/solid/check
      question: fontawesome/solid/circle-question
      warning: fontawesome/solid/triangle-exclamation
      failure: fontawesome/solid/xmark
      danger: fontawesome/solid/skull-crossbones
      bug: fontawesome/solid/bug
      example: fontawesome/solid/flask
      quote: fontawesome/solid/quote-left

  features:
    - navigation.instant         
    - navigation.instant.progress 
    - navigation.tracking        
    - navigation.path            
    - navigation.top             
    - navigation.footer          

    - toc.follow                 

    - search.suggest             
    - search.highlight           
    - search.share               

    - content.code.copy          
    - content.code.annotate      
    - content.tabs.link          
    - content.tooltips           

  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black        
      accent: cyan          
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/collectionlessai/
      name: GitHub
    - icon: fontawesome/solid/globe
      link: https://unaiverse.io
      name: UNaIVERSE Website
    - icon: fontawesome/brands/discord
      link: https://discord.gg/yourserver
      name: Community
  
  generator: false

extra_css:
  - css/extra.css  

plugins:
  - search
  
  - literate-nav:
      nav_file: SUMMARY.md

  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          import:
            - https://docs.python.org/3/objects.inv
          options:
            extensions:
              - griffe_pydantic

            docstring_style: google
            docstring_section_style: table
            heading_level: 2

            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_object_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

            show_signature: true
            show_signature_annotations: true
            separate_signature: false
            signature_crossrefs: true
            unwrap_annotated: true

            merge_init_into_class: false
            show_bases: false
            show_if_no_docstring: false
            members_order: source
            group_by_category: true
            show_submodules: false
            docstring_options:
              ignore_init_summary: true
              trim_doctest_flags: true

            filters:
              - "!^_"
              - "!^__init__$"
              - "!^model_"
              - "!^Model"                

  - gen-files:
      scripts:
        - docs_gen.py

markdown_extensions:
  - meta
  - abbr
  - attr_list            
  - md_in_html
  - def_list
  - footnotes
  - tables
  
  - admonition
  - pymdownx.details     
  - pymdownx.superfences 
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

  - pymdownx.tabbed:
      alternate_style: true 
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys           
  - pymdownx.caret          
  - pymdownx.mark           
  - pymdownx.tilde          

  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: collectionlessai
      repo: unaiverse-src

  - toc:
      permalink: "🔗"
      toc_depth: 4

nav:
  - Home: index.md
  - API Reference: SUMMARY.md