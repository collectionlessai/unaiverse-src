[build-system]
requires = ["setuptools>=70.1"]
build-backend = "setuptools.build_meta"

[project]
name = "unaiverse"
version = "0.1.31"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "graphviz",
    "ntplib",
    "numpy",
    "Pillow",
    "protobuf",
    "psutil",
    "PyJWT",
    "cryptography",
    "Requests",
    "torch",
    "torchvision",
    "transformers",
    "sortedcontainers",
    "plotly",
    "prompt_toolkit",
    "tqdm",
    "typing_extensions"
]
license-files = ["LICENSE"]
keywords = ["UNaIVERSE", "Collectionless AI", "AI", "Agentic AI", "Agents", "Machine Learning", "Learning Over Time"]
description = "UNaIVERSE: A Collectionless AI Project. The new web of humans & AI Agents, built on privacy, control, and reduced energy consumption."
readme = "README.md"
authors = [
    { name = "Stefano Melacci", email = "stefano.melacci@unisi.it" },
    { name = "Christian Di Maio", email = "christian.dimaio@phd.unipi.it" },
    { name = "Tommaso Guidi", email = "tommaso.guidi.1998@gmail.com" }
]
maintainers = [
    { name = "Stefano Melacci", email = "stefano.melacci@unisi.it" },
    { name = "Christian Di Maio", email = "christian.dimaio@phd.unipi.it" },
    { name = "Tommaso Guidi", email = "tommaso.guidi.1998@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

# Development-only requirements: never install requirements of the published wheel.
# Declared twice on purpose. The extra serves plain pip (`pip install -e ".[dev]"`);
# the dependency group (PEP 735) is what `uv sync` installs by DEFAULT, so the test
# tooling survives a bare sync instead of being pruned every time.
[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.setuptools.package-data]
"unaiverse" = ["utils/public.json"]

# The Go sources of the shared library travel in the sdist only: a wheel carries the built library alone
[tool.setuptools.packages.find]
where = ["src"]
exclude = ["unaiverse.networking.p2p.unailib*"]

[tool.setuptools.exclude-package-data]
"unaiverse.networking.p2p" = ["unailib/*", "unailib/*/*"]

# Optional, read by uv only (pip and setuptools ignore it): uv rebuilds a local package only when one of
# these files changes, so listing the Go sources makes `uv sync` and `uv run` rebuild the library by
# themselves after a change to unailib/
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/unaiverse/networking/p2p/_unailib_source.py" },
    { file = "src/unaiverse/networking/p2p/unailib/**/*.go" },
    { file = "src/unaiverse/networking/p2p/unailib/go.mod" },
    { file = "src/unaiverse/networking/p2p/unailib/go.sum" },
]

[project.urls]
A-ProjectHomepage = "https://unaiverse.io"
B-Company = "https://unaiverse.ai"
C-CollectionlessAI = "https://collectionless.ai"
D-Source = "https://github.com/collectionlessai/unaiverse-src"
E-Starting = "https://github.com/collectionlessai/unaiverse-src/blob/main/README.md"
F-Examples = "https://github.com/collectionlessai/unaiverse-examples"
G-Documentation = "https://github.com/collectionlessai/unaiverse-src/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

# --- CIBUILDWHEEL CONFIGURATION ---
[tool.cibuildwheel]
# The wheel is py3-none-<platform> (see setup.py), so cibuildwheel builds it on the first identifier and
# reuses it for the others: one wheel per platform
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*"]
# Skip 32-bit, musl and free-threaded builds
skip = ["*-win32", "*-manylinux_i686", "*-musllinux_*", "cp3??t-*"]

# Platform-specific configurations. On macOS and Windows the build runs on the runner itself, where the
# workflow installs Go with actions/setup-go; on Linux it runs inside the manylinux container.
[tool.cibuildwheel.linux]
# Install, inside the container, the Go version that go.mod declares, so that it is set in one place only
before-all = '''
    set -euxo pipefail

    # Detect architecture and set the corresponding Go arch name
    case "$(uname -m)" in
        x86_64)
            GO_ARCH=amd64
            ;;
        aarch64)
            GO_ARCH=arm64
            ;;
        *)
            echo "Unsupported architecture: $(uname -m)"
            exit 1
            ;;
    esac

    GO_VERSION=$(sed -n 's/^go //p' {package}/src/unaiverse/networking/p2p/unailib/go.mod)
    curl -fsSL -o go.tar.gz "https://go.dev/dl/go${GO_VERSION}.linux-${GO_ARCH}.tar.gz"
    rm -rf /usr/local/go
    tar -C /usr/local -xzf go.tar.gz
    rm go.tar.gz
'''
# Persistently add Go to the PATH for all subsequent steps.
environment = { PATH = "/usr/local/go/bin:$PATH" }

[tool.cibuildwheel.macos]
# Go binaries require macOS 11, so the wheel must not claim support for older releases
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
# p2p tests are opt-in: excluded by default so the fast suite needs no libp2p
# node / NIC. Run them with `pytest -m p2p` (the CLI -m overrides this default).
addopts = "-m 'not p2p'"
markers = [
    "p2p: integration tests that start real libp2p nodes (slow, opt-in with -m p2p)",
    "unit: isolated-component / pure-function tests with light mocks",
    "e2e: end-to-end tests exercising several components in concert (mocked transport)",
]
